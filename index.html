<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:#f5f4f0;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
@media(prefers-color-scheme:dark){
  body{background:#1a1a18}
  :root{
    --card:#242422;--bg2:#2e2e2b;
    --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.22);
    --t1:#f0ede8;--t2:#888;
  }
}
@media(prefers-color-scheme:light){
  :root{
    --card:#ffffff;--bg2:#f1efe8;
    --border:rgba(0,0,0,.1);--border2:rgba(0,0,0,.25);
    --t1:#1a1a1a;--t2:#666;
  }
}
:root{
  --accent:#E24B4A;--accent2:#378ADD;--accent3:#BA7517;
}
#root{min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh}

/* Top bar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;
  padding-top:max(12px, env(safe-area-inset-top));
  background:var(--card);
  border-bottom:0.5px solid var(--border);
  position:sticky;top:0;z-index:50;
}
.logo{font-size:22px;font-weight:800;letter-spacing:2px;color:var(--accent)}
.logo span{color:var(--t1)}
.datebadge{font-size:11px;color:var(--t2);background:var(--bg2);padding:4px 10px;border-radius:20px}

/* Bottom nav (mobile-first) */
.nav{
  display:flex;background:var(--card);
  border-top:0.5px solid var(--border);
  position:fixed;bottom:0;left:0;right:0;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:50;
}
.navbtn{
  flex:1;padding:10px 4px 8px;font-size:10px;
  border:none;background:transparent;color:var(--t2);
  cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.navbtn.active{color:var(--accent);font-weight:600}
.navbtn svg{width:22px;height:22px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

/* Content area */
.content{
  padding:16px;
  padding-bottom:calc(80px + env(safe-area-inset-bottom));
  flex:1;
}

/* Cards */
.card{background:var(--card);border:0.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.cardtitle{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.ptitle{font-size:26px;font-weight:800;letter-spacing:.5px;color:var(--t1);margin-bottom:2px}
.psub{font-size:13px;color:var(--t2);margin-bottom:16px}

/* Forms */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.fg label{font-size:12px;color:var(--t2);font-weight:500}
.fg input,.fg select{
  height:42px;border:0.5px solid var(--border2);border-radius:10px;
  padding:0 12px;font-size:16px;/* 16px prevents iOS zoom */
  background:var(--bg2);color:var(--t1);font-family:inherit;width:100%;
}
.fg input:focus,.fg select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Buttons */
.btn{
  height:44px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:opacity .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  -webkit-appearance:none;appearance:none;
}
.btnp{background:var(--accent);color:#fff;border:none}
.btnp:active{opacity:.8}
.btns{background:transparent;color:var(--t1);border:0.5px solid var(--border2)}
.btns:active{background:var(--bg2)}
.btnsm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btnd{
  background:transparent;color:#E24B4A;border:0.5px solid #E24B4A;
  height:30px;padding:0 10px;font-size:12px;border-radius:8px;
  cursor:pointer;font-family:inherit;font-weight:500;
}

/* Tags */
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600}
.tr{background:#FCEBEB;color:#A32D2D}
.tb{background:#E6F1FB;color:#185FA5}
.tg{background:#EAF3DE;color:#3B6D11}
.ta{background:#FAEEDA;color:#854F0B}
.tp{background:#FBEAF0;color:#72243E}
@media(prefers-color-scheme:dark){
  .tr{background:#3a1515;color:#f09595}
  .tb{background:#0d2a42;color:#85B7EB}
  .tg{background:#152a0a;color:#97C459}
  .ta{background:#2e1d04;color:#EF9F27}
  .tp{background:#2a0e1c;color:#ED93B1}
}

/* Exercise picker */
.picker-wrap{position:relative}
.picker-search{
  width:100%;height:44px;border:0.5px solid var(--border2);border-radius:10px;
  padding:0 14px;font-size:16px;background:var(--bg2);color:var(--t1);font-family:inherit;
}
.picker-search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.picker-dropdown{
  position:absolute;top:48px;left:0;right:0;
  background:var(--card);border:0.5px solid var(--border2);border-radius:12px;
  z-index:200;max-height:300px;overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.18);
}
.picker-group-label{
  padding:8px 14px 4px;font-size:10px;font-weight:600;color:var(--t2);
  text-transform:uppercase;letter-spacing:.5px;
  position:sticky;top:0;background:var(--card);border-bottom:0.5px solid var(--border);
}
.picker-option{
  padding:12px 14px;font-size:15px;color:var(--t1);cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  -webkit-tap-highlight-color:rgba(0,0,0,.05);
}
.picker-option:active{background:var(--bg2)}
.picker-new-row{
  padding:12px 14px;font-size:13px;color:var(--accent2);cursor:pointer;
  display:flex;align-items:center;gap:8px;border-top:0.5px solid var(--border);
  font-weight:500;
}
.picker-new-row:active{background:var(--bg2)}

/* Exercise block */
.exblock{border:0.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--card)}
.exblock-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.exblock-name{font-size:15px;font-weight:600;color:var(--t1)}

.series-header{display:grid;gap:6px;font-size:10px;color:var(--t2);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px;align-items:center}
.series-row{display:grid;gap:6px;align-items:center;margin-bottom:8px}
.series-header.strength,.series-row.strength{grid-template-columns:28px 1fr 1fr 28px}
.series-header.cardio,.series-row.cardio{grid-template-columns:28px 1fr 1fr 28px}
.series-input{
  height:36px;border:0.5px solid var(--border2);border-radius:8px;
  padding:0 8px;font-size:16px;background:var(--bg2);color:var(--t1);
  font-family:inherit;width:100%;text-align:center;
}
.series-input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.series-num{font-size:12px;color:var(--t2);font-weight:600;text-align:center}
.rmv-btn{background:transparent;border:none;color:var(--t2);cursor:pointer;font-size:18px;padding:0;opacity:.5;line-height:1}
.rmv-btn:active{opacity:1;color:#E24B4A}
.add-set-btn{
  height:34px;font-size:13px;background:transparent;
  border:0.5px dashed var(--border2);border-radius:8px;
  color:var(--t2);cursor:pointer;font-family:inherit;width:100%;margin-top:4px;
}
.add-set-btn:active{background:var(--bg2)}

/* Notices */
.notice{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:500;border:0.5px solid transparent}
.notice-info{background:#E6F1FB;color:#185FA5;border-color:#378ADD}
.notice-err{background:#FCEBEB;color:#A32D2D}
.notice-ok{background:#EAF3DE;color:#3B6D11}
@media(prefers-color-scheme:dark){
  .notice-info{background:#0d2a42;color:#85B7EB;border-color:#185FA5}
  .notice-err{background:#3a1515;color:#f09595}
  .notice-ok{background:#152a0a;color:#97C459}
}

/* Calorie preview */
.cal-preview{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:#FAEEDA;border:0.5px solid #FAC775;border-radius:12px;margin-bottom:12px;
}
@media(prefers-color-scheme:dark){.cal-preview{background:#2e1d04;border-color:#854F0B}}
.kcal-num{font-size:28px;font-weight:800;color:#BA7517}
.kcal-sub{font-size:12px;color:#854F0B;font-weight:500}
.kcal-note{font-size:11px;color:#854F0B;opacity:.8;margin-top:2px}

/* Stats */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mcard{background:var(--bg2);border-radius:10px;padding:12px 14px}
.mlabel{font-size:11px;color:var(--t2);margin-bottom:4px;font-weight:500}
.mval{font-size:22px;font-weight:700;color:var(--t1)}
.mval .unit{font-size:12px;color:var(--t2);font-weight:400}
.chartw{position:relative;width:100%;height:200px}

/* History cards */
.hcard{background:var(--card);border:0.5px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.hcard-open{border-color:var(--border2)}
.hcard-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hcard-header:active{background:var(--bg2)}
.hcard-left{flex:1;min-width:0}
.hcard-date{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:6px}
.hcard-meta{display:flex;gap:5px;flex-wrap:wrap}
.hcard-chevron{color:var(--t2);flex-shrink:0;transition:transform .22s cubic-bezier(.2,.8,.4,1)}

/* Session detail */
.session-detail-wrap{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .32s cubic-bezier(.2,.8,.4,1);
}
.hcard-open .session-detail-wrap{
  grid-template-rows:1fr;
}
.session-detail-wrap-inner{
  overflow:hidden;
}
.session-detail{
  padding:0 16px 16px;
  border-top:0.5px solid var(--border);
  opacity:0;
  transform:translateY(-6px);
  transition:opacity .25s .1s ease, transform .3s .08s cubic-bezier(.2,.8,.4,1);
}
.hcard-open .session-detail{
  opacity:1;
  transform:translateY(0);
}
.session-detail-stats{display:flex;gap:8px;padding:14px 0 12px;border-bottom:0.5px solid var(--border);margin-bottom:14px}
.sds-item{flex:1;text-align:center;padding:10px 6px;background:var(--bg2);border-radius:10px}
.sds-val{font-size:17px;font-weight:800;color:var(--t1);line-height:1;font-variant-numeric:tabular-nums}

/* Session Complete Modal */

/* Body map: placas musculares separadas por un trazo del color de la tarjeta */
:root{--bm-sil:#ebe8e1;--bm-l0:#dedad1;--bm-l1:#F7C1C1;--bm-l2:#EE8A89;--bm-l3:#E24B4A;--bm-l4:#A32D2D}

  /* En oscuro la intensidad sube en luminosidad: más series = más claro */
  :root{--bm-sil:#33322f;--bm-l0:#3d3c38;--bm-l1:#762d2d;--bm-l2:#b23434;--bm-l3:#E24B4A;--bm-l4:#ffa3a2}

.bm .bm-l1,.bm .bm-l2,.bm .bm-l3,.bm .bm-l4{animation:bmIn .7s .35s both ease-out}
@keyframes bmIn{from{fill:var(--bm-l0)}}

<body>
<div id="root"></div>

<script>
const {useState,useEffect,useRef,useMemo} = React;
const h = React.createElement;

// ---- Constants ----
const MUSCLES=['Pecho','Espalda','Piernas','Hombros','Bíceps','Tríceps','Core','Glúteos','Cardio'];
const MUSCLE_COLORS={Pecho:'tr',Espalda:'tb',Piernas:'tg',Hombros:'ta',Bíceps:'tb',Tríceps:'tr',Core:'tp',Glúteos:'tg',Cardio:'tb'};
const MUSCLE_MET={Pecho:4.0,Espalda:4.2,Piernas:5.0,Hombros:3.8,Bíceps:3.5,Tríceps:3.5,Core:3.8,Glúteos:4.5};

const DEFAULT_LIBRARY=[
  {id:'press-banca',name:'Press de banca',muscle:'Pecho',isCardio:false},
  {id:'press-inclinado',name:'Press inclinado',muscle:'Pecho',isCardio:false},
  {id:'aperturas',name:'Apertura con mancuernas',muscle:'Pecho',isCardio:false},
  {id:'fondos',name:'Fondo en paralelas',muscle:'Pecho',isCardio:false},
  {id:'jalones',name:'Jalón al pecho',muscle:'Espalda',isCardio:false},
  {id:'remo-barra',name:'Remo con barra',muscle:'Espalda',isCardio:false},
  {id:'dominadas',name:'Dominada',muscle:'Espalda',isCardio:false},
  {id:'remo-polea',name:'Remo en polea',muscle:'Espalda',isCardio:false},
  {id:'sentadilla',name:'Sentadilla',muscle:'Piernas',isCardio:false},
  {id:'prensa',name:'Prensa de piernas',muscle:'Piernas',isCardio:false},
  {id:'peso-muerto',name:'Peso muerto',muscle:'Piernas',isCardio:false},
  {id:'extension-cuad',name:'Extensión de cuádriceps',muscle:'Piernas',isCardio:false},
  {id:'curl-femoral',name:'Curl femoral',muscle:'Piernas',isCardio:false},
  {id:'press-militar',name:'Press militar',muscle:'Hombros',isCardio:false},
  {id:'elevaciones-lat',name:'Elevación lateral',muscle:'Hombros',isCardio:false},
  {id:'pajaro',name:'Pájaro con mancuernas',muscle:'Hombros',isCardio:false},
  {id:'curl-biceps',name:'Curl de bíceps',muscle:'Bíceps',isCardio:false},
  {id:'curl-martillo',name:'Curl martillo',muscle:'Bíceps',isCardio:false},
  {id:'press-frances',name:'Press francés',muscle:'Tríceps',isCardio:false},
  {id:'extension-triceps',name:'Extensión de tríceps en polea',muscle:'Tríceps',isCardio:false},
  {id:'crunch',name:'Crunch abdominal',muscle:'Core',isCardio:false},
  {id:'plancha',name:'Plancha',muscle:'Core',isCardio:false},
  {id:'hip-thrust',name:'Hip thrust',muscle:'Glúteos',isCardio:false},
  {id:'patada-gluteo',name:'Patada de glúteo',muscle:'Glúteos',isCardio:false},
  {id:'carrera',name:'Carrera',muscle:'Cardio',isCardio:true},
  {id:'bicicleta',name:'Bicicleta estática',muscle:'Cardio',isCardio:true},
  {id:'eliptica',name:'Elíptica',muscle:'Cardio',isCardio:true},
  {id:'remo-cardio',name:'Remo ergómetro',muscle:'Cardio',isCardio:true},
  {id:'cuerda',name:'Comba',muscle:'Cardio',isCardio:true},
];

// Nombres anteriores de los ejercicios por defecto, para migrar datos guardados con ellos
const LEGACY_NAMES={
  'press-banca':['Press banca'],
  'aperturas':['Aperturas con mancuernas'],
  'fondos':['Fondos en paralelas'],
  'jalones':['Jalones al pecho'],
  'dominadas':['Dominadas'],
  'elevaciones-lat':['Elevaciones laterales'],
  'extension-triceps':['Extensión tríceps polea'],
  'remo-cardio':['Remo (cardio)'],
  'cuerda':['Comba / Saltar a la cuerda'],
};
const DEFAULT_BY_ID=Object.fromEntries(DEFAULT_LIBRARY.map(e=>[e.id,e]));
// Nombre (antiguo o actual) de un ejercicio por defecto → id
const DEFAULT_ID_BY_NAME=Object.fromEntries([
  ...DEFAULT_LIBRARY.map(e=>[e.name,e.id]),
  ...Object.entries(LEGACY_NAMES).flatMap(([id,names])=>names.map(n=>[n,id])),
]);

// Actualiza el nombre de un ejercicio de sesión al estándar actual. Solo toca nombres que coinciden
// exactamente con uno por defecto (los renombrados por el usuario y los personalizados se respetan).
// Si no tiene libraryId pero el nombre es de uno por defecto, lo vincula. Idempotente.
function migrateExercise(e){
  if(e.libraryId){
    const def=DEFAULT_BY_ID[e.libraryId];
    return def&&LEGACY_NAMES[e.libraryId]?.includes(e.name)?{...e,name:def.name}:e;
  }
  const id=DEFAULT_ID_BY_NAME[e.name];
  return id?{...e,libraryId:id,name:DEFAULT_BY_ID[id].name}:e;
}
function migrateSessions(sessions){
  return sessions.map(s=>({...s,exercises:s.exercises.map(migrateExercise)}));
}
// Renombra a los nombres actuales y añade los ejercicios por defecto que falten: la biblioteca se guarda
// entera en el dispositivo y los por defecto no se pueden borrar, así que uno ausente es uno nuevo
function migrateLibrary(library){
  const migrated=library.map(e=>DEFAULT_BY_ID[e.id]&&LEGACY_NAMES[e.id]?.includes(e.name)?{...e,name:DEFAULT_BY_ID[e.id].name}:e);
  const ids=new Set(migrated.map(e=>e.id));
  return [...migrated,...DEFAULT_LIBRARY.filter(e=>!ids.has(e.id))];
}

// ---- Local Storage ----
function loadState(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch(e){return def;}}
let storageWarned=false;
function saveState(key,val){
  try{localStorage.setItem(key,JSON.stringify(val));}
  catch(e){
    if(!storageWarned){
      storageWarned=true;
      alert('⚠ No se han podido guardar los datos (almacenamiento lleno o bloqueado). Exporta una copia de seguridad desde la pestaña Backup cuanto antes.');
    }
  }
}

// ---- Calorie estimation (MET-based, Ainsworth et al. 2011) ----
function estimateStrengthCals(exercise,bw){
  if(!bw||bw<=0)return 0;
  const met=MUSCLE_MET[exercise.muscle]||4.0;
  return Math.round(exercise.sets.reduce((t,s)=>{
    const reps=parseInt(s.reps)||0;if(!reps)return t;
    const hrs=(reps*3+90)/3600;
    const im=reps<=5?1.25:reps<=10?1.05:reps<=15?0.9:0.75;
    const lf=1+((parseFloat(s.weight)||0)/(bw*3))*0.15;
    return t+met*im*lf*bw*hrs;
  },0));
}
// MET por actividad (Compendium of Physical Activities, intensidad moderada); 7.0 para cardio personalizado
const CARDIO_MET={carrera:9.8,bicicleta:6.8,eliptica:5.0,'remo-cardio':7.0,cuerda:11.8};
function cardioSetMET(exercise,s){
  const min=parseFloat(s.duration)||0, km=parseFloat(s.distance)||0;
  // Carrera con distancia: ecuaciones metabólicas del ACSM según la velocidad (caminar por debajo de 6.5 km/h)
  if(exercise.libraryId==='carrera'&&min>0&&km>0){
    const mPerMin=km*1000/min, kmh=km/(min/60);
    const vo2=(kmh>=6.5?0.2:0.1)*mPerMin+3.5;
    return vo2/3.5;
  }
  return CARDIO_MET[exercise.libraryId]||7.0;
}
function estimateCardioCals(exercise,bw){
  if(!bw||bw<=0)return 0;
  return Math.round(exercise.sets.reduce((t,s)=>t+cardioSetMET(exercise,s)*bw*((parseFloat(s.duration)||0)/60),0));
}
function calcSessionCals(exercises,bw){
  return exercises.reduce((t,e)=>t+(e.isCardio?estimateCardioCals(e,bw):estimateStrengthCals(e,bw)),0);
}

// ---- Session helpers ----
function setHasData(e,s){
  return e.isCardio?(parseFloat(s.duration)>0||parseFloat(s.distance)>0):(parseFloat(s.weight)>0||parseInt(s.reps)>0);
}
function newSessionExercise(libEx){
  return {id:Date.now(),libraryId:libEx.id,name:libEx.name,muscle:libEx.muscle,isCardio:libEx.isCardio,
    sets:libEx.isCardio?[{id:Date.now(),duration:'',distance:''}]:[{id:Date.now(),reps:'',weight:''}]};
}
function exerciseHasData(e){return e.sets.some(s=>s.weight||s.reps||s.duration||s.distance);}
// Quita series vacías y ejercicios que se quedan sin series
function cleanExercises(exercises){
  return exercises.map(e=>({...e,sets:e.sets.filter(s=>setHasData(e,s))})).filter(e=>e.sets.length>0);
}
function sumSets(exercises,cardio,fn){
  return exercises.filter(e=>!!e.isCardio===cardio).reduce((t,e)=>t+e.sets.reduce((a,s)=>a+fn(s),0),0);
}
function sessionTotals(exercises,bw){
  return {
    totalVolume:sumSets(exercises,false,s=>(parseFloat(s.weight)||0)*(parseInt(s.reps)||0)),
    totalCardioMin:sumSets(exercises,true,s=>parseFloat(s.duration)||0),
    totalCardioKm:sumSets(exercises,true,s=>parseFloat(s.distance)||0),
    calories:bw>0?calcSessionCals(exercises,bw):0,
  };
}
// Peso corporal registrado en una fecha (último registro anterior o igual); si no hay, el más antiguo
function weightAt(weightLog,date){
  if(!weightLog.length)return 0;
  const t=new Date(date);
  let w=weightLog[0].weight;
  weightLog.forEach(e=>{if(parseLocalDate(e.date)<=t)w=e.weight;});
  return w;
}

// ---- Helpers ----
function today(){return new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}
// Fecha local actual que se actualiza a medianoche y al volver a la app (iOS congela los timers en segundo plano)
function useCurrentDay(){
  const [day,setDay]=useState(()=>localISODate());
  useEffect(()=>{
    const check=()=>setDay(localISODate());
    let t;
    const schedule=()=>{
      const n=new Date();
      const next=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);
      t=setTimeout(()=>{check();schedule();},next-n+1000);
    };
    schedule();
    document.addEventListener('visibilitychange',check);
    return()=>{clearTimeout(t);document.removeEventListener('visibilitychange',check);};
  },[]);
  return day;
}
function fmtDate(d){return new Date(d).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function fmtShort(d){return new Date(d).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}
// Fecha local "YYYY-MM-DD" (toISOString() da el día UTC, que entre 00:00 y 02:00 en España es ayer)
function localISODate(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
// Interpreta "YYYY-MM-DD" como medianoche local, no UTC
function parseLocalDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)?new Date(s+'T00:00'):new Date(s);}
function isValidDate(s){return !isNaN(parseLocalDate(s).getTime());}
// Identidad estable de un ejercicio: libraryId sobrevive a renombrados; el nombre es fallback para datos antiguos
function exKey(e){return e.libraryId?'id:'+e.libraryId:'name:'+e.name;}
// Texto para búsqueda: sin tildes ni mayúsculas
function normalizeText(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
const SEARCH_STOPWORDS=new Set(['de','del','la','el','los','las','con','en','al','a','y']);
// Palabras de la consulta (orden indiferente), sin palabras vacías
function searchTokens(q){return normalizeText(q).split(/\s+/).filter(t=>t&&!SEARCH_STOPWORDS.has(t));}

// ---- Charts ----
// Sigue el tema del sistema en vivo para que los gráficos se repinten al cambiar a modo oscuro/claro
function useDarkMode(){
  const [dark,setDark]=useState(()=>matchMedia('(prefers-color-scheme:dark)').matches);
  useEffect(()=>{
    const mq=matchMedia('(prefers-color-scheme:dark)');
    const onChange=e=>setDark(e.matches);
    mq.addEventListener('change',onChange);
    return()=>mq.removeEventListener('change',onChange);
  },[]);
  return dark;
}
function BarChart({labels,data,color}){
  const ref=useRef(),cr=useRef();
  const dk=useDarkMode();
  useEffect(()=>{
    if(!ref.current)return;
    if(cr.current)cr.current.destroy();
    const gc=dk?'rgba(255,255,255,.07)':'rgba(0,0,0,.06)',tc=dk?'#777':'#888';
    cr.current=new Chart(ref.current,{
      type:'bar',
      data:{labels,datasets:[{data,backgroundColor:color||'#E24B4A',borderRadius:5}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{color:gc},ticks:{color:tc,font:{size:10}}},
                y:{grid:{color:gc},ticks:{color:tc,font:{size:10},callback:v=>v>=1000?(v/1000).toFixed(1)+'k':v}}}}
    });
    return()=>{if(cr.current)cr.current.destroy()};
  },[labels,data,color,dk]);
  return h('div',{className:'chartw'},h('canvas',{ref}));
}
function LineChart({labels,data,color,unit}){
  const ref=useRef(),cr=useRef();

    if(!ref.current)return;

  return h('div',{className:'chartw'},h('canvas',{ref}));
}

// ---- Exercise Picker ----
function ExercisePicker({library,onSelect,onCreateNew}){
  const [query,setQuery]=useState('');
  const [open,setOpen]=useState(false);
  const ref=useRef();
  useEffect(()=>{
    function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener('touchstart',h);document.addEventListener('mousedown',h);
    return()=>{document.removeEventListener('touchstart',h);document.removeEventListener('mousedown',h)};
  },[]);
  const haystacks=useMemo(()=>library.map(e=>normalizeText(e.name+' '+e.muscle)),[library]);
  const filtered=useMemo(()=>{
    const tokens=searchTokens(query);
    if(!tokens.length)return library;
    return library.filter((_,i)=>tokens.every(t=>haystacks[i].includes(t)));
  },[library,haystacks,query]);
  const grouped=useMemo(()=>{
    const g={};filtered.forEach(e=>{if(!g[e.muscle])g[e.muscle]=[];g[e.muscle].push(e);});return g;
  },[filtered]);
  function select(ex){setQuery('');setOpen(false);onSelect(ex);}
  return h('div',{className:'picker-wrap',ref},
    h('input',{className:'picker-search',placeholder:'Buscar ejercicio...',value:query,
      onFocus:()=>setOpen(true),onChange:e=>{setQuery(e.target.value);setOpen(true);}}),
    open&&h('div',{className:'picker-dropdown'},
      Object.entries(grouped).map(([muscle,exs])=>h('div',{key:muscle},
        h('div',{className:'picker-group-label'},muscle),
        // onClick (no onTouchEnd): el navegador no lo dispara si el gesto fue un scroll de la lista
        exs.map(ex=>h('div',{key:ex.id,className:'picker-option',onClick:()=>select(ex)},
          h('span',null,ex.name),
          h('span',{className:`tag ${MUSCLE_COLORS[ex.muscle]||'tb'}`},ex.muscle)
        ))
      )),
      onCreateNew&&h('div',{className:'picker-new-row',onClick:()=>{setOpen(false);onCreateNew(query);}},
        h('span',{style:{fontSize:18,lineHeight:1}},'+'),
        h('span',null,query?`Crear "${query}"...`:'Añadir ejercicio nuevo')
      )
    )
  );
}

// ---- Achievements engine ----
// Racha más larga de días consecutivos en todo el historial (los logros, una vez conseguidos, no se pierden)
function calcStreak(sessions){
  if(!sessions.length)return 0;
  const days=[...new Set(sessions.map(s=>new Date(s.date).toDateString()))].map(d=>new Date(d)).sort((a,b)=>b-a);
  let streak=1,max=1;
  for(let i=1;i<days.length;i++){
    // Math.round: en el cambio de hora un día dura 23 o 25 h
    const diff=Math.round((days[i-1]-days[i])/864e5);
    if(diff===1){streak++;max=Math.max(max,streak);}else streak=1;
  }
  return max;
}
// Peso máximo en un ejercicio de la biblioteca por defecto. Se compara por libraryId (no por subcadena del nombre,
// que contaba p.ej. "Sentadilla búlgara" como sentadilla); sesiones sin libraryId se comparan por nombre exacto.
function maxWeightForExercise(sessions,libId){
  const defName=DEFAULT_LIBRARY.find(e=>e.id===libId)?.name;
  let max=0;
  sessions.forEach(s=>s.exercises.filter(e=>e.libraryId?e.libraryId===libId:e.name===defName).forEach(e=>{
    e.sets.forEach(set=>{const w=parseFloat(set.weight)||0;if(w>max)max=w;});
  }));
  return max;
}
function totalVolume(sessions){return sessions.reduce((t,s)=>t+s.totalVolume,0);}
function totalSessions(sessions){return sessions.length;}
function totalCalories(sessions){return sessions.reduce((t,s)=>t+(s.calories||0),0);}
function totalCardioMin(sessions){return sessions.reduce((t,s)=>t+(s.totalCardioMin||0),0);}
function muscleGroupCount(sessions){
  const groups=new Set();
  sessions.forEach(s=>s.exercises.forEach(e=>{if(!e.isCardio)groups.add(e.muscle);}));
  return groups.size;
}
function uniqueExerciseCount(sessions){
  const names=new Set();
  sessions.forEach(s=>s.exercises.forEach(e=>names.add(exKey(e))));
  return names.size;
}
function maxSingleSessionVolume(sessions){
  return sessions.reduce((m,s)=>Math.max(m,s.totalVolume),0);
}
function maxSingleSessionCal(sessions){
  return sessions.reduce((m,s)=>Math.max(m,s.calories||0),0);
}
function daysActive(sessions){
  return new Set(sessions.map(s=>new Date(s.date).toDateString())).size;
}

function AchievementsSection({sessions}){
  // Cada logro recorre todo el historial: recalcular solo cuando cambian las sesiones
  const evaluated=useMemo(()=>ACHIEVEMENTS.map(a=>({...a,unlocked:a.check(sessions),progress:a.prog(sessions)})),[sessions]);
  const unlocked=evaluated.filter(a=>a.unlocked).length;
  const cats=[...new Set(ACHIEVEMENTS.map(a=>a.cat))];

  return h('div',null,
    h('div',{className:'ach-summary'},
      h('div',{className:'ach-summary-num'},unlocked+'/'+ACHIEVEMENTS.length),
      h('div',null,
        h('div',{style:{fontSize:14,fontWeight:700,color:'var(--t1)'}},unlocked===0?'Sin logros todavía':unlocked===ACHIEVEMENTS.length?'¡Todos los logros!':'Logros desbloqueados'),
        h('div',{className:'ach-summary-text'},'Sigue entrenando para desbloquear más')
      )
    ),
    cats.map(cat=>{
      const catAchs=evaluated.filter(a=>a.cat===cat);
      return h('div',{key:cat},
        h('div',{className:'ach-cat-label'},cat),
        h('div',{className:'ach-grid'},
          catAchs.map(a=>{
            const pct=a.progress.t>0?Math.round((a.progress.v/a.progress.t)*100):0;
            return h('div',{key:a.id,className:'ach-card '+(a.unlocked?'unlocked':'locked'),
              style:a.unlocked?{'--ach-color':a.color}:{}},
              h('span',{className:'ach-icon'},a.icon),
              h('div',{className:'ach-name'},a.name),
              h('div',{className:'ach-desc'},a.desc),
              !a.unlocked&&a.progress.t>0&&h('div',null,
                h('div',{className:'ach-prog-wrap'},
                  h('div',{className:'ach-prog',style:{width:pct+'%',background:a.color}})

    })

}

// ---- Helpers for profile ----
function calcAge(dob){
  if(!dob)return '';
  const b=new Date(dob), now=new Date();
  let age=now.getFullYear()-b.getFullYear();
  if(now<new Date(now.getFullYear(),b.getMonth(),b.getDate()))age--;
  return age;
}
function getInitials(name){
  if(!name)return '?';
  return name.trim().split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
}

function ProfileTab({profile,onChange,weightLog,onAddWeight,onRemoveWeight,sessions}){

  const [draft,setDraft]=useState(profile);
  const [newWeight,setNewWeight]=useState('');
  const [newWeightDate,setNewWeightDate]=useState(()=>localISODate());
  const todayISO=localISODate();
  // Si cambia el día con la fecha en "hoy", seguir en hoy (no dejarla en ayer)
  const prevToday=useRef(todayISO);
  useEffect(()=>{
    if(newWeightDate===prevToday.current)setNewWeightDate(todayISO);
    prevToday.current=todayISO;
  },[todayISO]);

  const currentWeight=weightLog.length>0?weightLog[weightLog.length-1].weight:null;
  const sortedLog=useMemo(()=>[...weightLog].sort((a,b)=>parseLocalDate(a.date)-parseLocalDate(b.date)),[weightLog]);

  function saveProfile(){
    if(!draft.sex){alert('Selecciona el sexo');return;}
    onChange(draft);setEditing(false);
  }
  function addWeight(){
    const w=parseFloat(newWeight);

    // Edit form
    editing&&h('div',{className:'card'},

const CARDIO_MIN_PER_SET=10; // 10 min de cardio cuentan como 1 serie
const SECONDARY_FACTOR=0.5;

// Series equivalentes de un ejercicio
function exerciseLoad(ex){
  if(ex.isCardio)return ex.sets.reduce((t,s)=>t+(parseFloat(s.duration)||0),0)/CARDIO_MIN_PER_SET;
  return ex.sets.filter(s=>setHasData(ex,s)).length;
}
// Series por zona del cuerpo; los músculos secundarios suman media serie
function regionLoads(exercises){
  const loads={};
  exercises.forEach(ex=>{
    const load=exerciseLoad(ex);
    if(!load)return;
    const {p,s}=EXERCISE_REGIONS[ex.libraryId]||GROUP_REGIONS[ex.muscle]||{p:[],s:[]};
    p.forEach(k=>loads[k]=(loads[k]||0)+load);
    s.forEach(k=>loads[k]=(loads[k]||0)+load*SECONDARY_FACTOR);
  });
  return loads;
}

function SessionCompleteModal({session,onClose}){
  const [visible,setVisible]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setVisible(true),30);return()=>clearTimeout(t);},[]);

  // Reparto por grupo muscular en series (antes en kg, que inflaba los ejercicios pesados)
  const groupLoad={};
  session.exercises.forEach(ex=>{
    const group=ex.isCardio?'Cardio':ex.muscle;
    groupLoad[group]=(groupLoad[group]||0)+exerciseLoad(ex);
  });
  const totalLoad=Object.values(groupLoad).reduce((a,b)=>a+b,0)||1;
  const musclePct=Object.entries(groupLoad)
    .map(([m,v])=>({muscle:m,pct:Math.round(v/totalLoad*100)}))
    .sort((a,b)=>b.pct-a.pct);

  const totalSets=session.exercises.filter(e=>!e.isCardio).reduce((t,e)=>t+e.sets.length,0);
  const totalCardioMin=session.exercises.filter(e=>e.isCardio).reduce((t,e)=>t+e.sets.reduce((s,set)=>s+(parseFloat(set.duration)||0),0),0);
  const durationSecs=session.durationSecs||0;

// ---- Workout Tab ----
function fmtDuration(secs){
  const h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
  if(h>0)return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

const DRAFT_KEY='il_draft';
const INACTIVITY_MS=15*60*1000;

// Cronómetro aislado: solo este componente se repinta cada segundo, no toda la pestaña.
// Detecta la inactividad y avisa al padre con onAutoPause(momento en que se congela).
function WorkoutTimer({timerStart,lastActivity,pausedAt,onAutoPause}){
  // Si ya se superó la inactividad (p.ej. borrador recuperado horas después), mostrar el tiempo congelado
  const endAt=()=>pausedAt||Math.min(Date.now(),lastActivity+INACTIVITY_MS);
  const [elapsed,setElapsed]=useState(()=>Math.max(0,Math.floor((endAt()-timerStart)/1000)));
  useEffect(()=>{
    const tick=()=>{
      if(!pausedAt&&Date.now()-lastActivity>INACTIVITY_MS){onAutoPause(lastActivity+INACTIVITY_MS);return false;}
      setElapsed(Math.max(0,Math.floor((endAt()-timerStart)/1000)));
      return true;
    };
    if(!tick()||pausedAt)return;
    const id=setInterval(tick,1000);
    return()=>clearInterval(id);
  },[timerStart,lastActivity,pausedAt]);

  return h('div',{className:'workout-timer',style:pausedAt?{borderColor:'#BA7517'}:{}},
    pausedAt
      ? h('div',{style:{width:8,height:8,borderRadius:'50%',background:'#BA7517',flexShrink:0}})
      : h('div',{className:'timer-dot'}),
    h('div',{className:'timer-display',style:pausedAt?{color:'#BA7517'}:{}},fmtDuration(elapsed)),
    h('div',{className:'timer-label'},pausedAt?'Pausado por inactividad':'Tiempo de sesión')
  );
}

function WorkoutTab({sessions,library,onSave,profile,weightLog,onGoToProfile,onAddToLibrary,onActiveSessionChange}){
  const [exercises,setExercises]=useState(()=>{
    // Restore draft on mount if one exists
    try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');return (d?.exercises||[]).map(migrateExercise);}catch{return[];}
  });
  const [timerStart,setTimerStart]=useState(()=>{
    try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');return d?.timerStart||null;}catch{return null;}
  });
  const [lastActivity,setLastActivity]=useState(()=>{
    try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');return d?.lastActivity||Date.now();}catch{return Date.now();}
  });
  const [pausedAt,setPausedAt]=useState(()=>{
    try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');return d?.pausedAt||null;}catch{return null;}
  });
  const [showNewEx,setShowNewEx]=useState(false);
  const [newExName,setNewExName]=useState('');
  const [completedSession,setCompletedSession]=useState(null);
  const [draftBanner,setDraftBanner]=useState(()=>{
    try{
      const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
      if(d?.exercises?.length>0){
        const date=d.savedAt?new Date(d.savedAt).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):null;
        return date;
      }
    }catch{}
    return null;
  });
  const bottomRef=useRef();
  const firstRender=useRef(true);
  const currentWeight=weightLog.length>0?weightLog[weightLog.length-1].weight:0;
  const estTotal=currentWeight>0?calcSessionCals(exercises,currentWeight):null;
  // Series de la última vez que se hizo cada ejercicio (sessions va de más reciente a más antigua).
  // Memoizado: antes se recorría todo el historial por cada ejercicio en cada tick del cronómetro.
  const prevSetsMap=useMemo(()=>{
    const byKey={},byName={};
    sessions.forEach(s=>s.exercises.forEach(x=>{
      if(!(exKey(x) in byKey))byKey[exKey(x)]=x.sets;
      if(!(x.name in byName))byName[x.name]=x.sets;
    }));
    return {byKey,byName};
  },[sessions]);

  // Autosave draft whenever relevant state changes
  useEffect(()=>{
    if(exercises.length>0){
      saveState(DRAFT_KEY,{exercises,timerStart,lastActivity,pausedAt,savedAt:new Date().toISOString()});
    } else {
      localStorage.removeItem(DRAFT_KEY);
    }
  },[exercises,timerStart,lastActivity,pausedAt]);

  // Notify App whether there's an active session
  useEffect(()=>{onActiveSessionChange&&onActiveSessionChange(exercises.length>0);},[exercises.length]);

  // Start timer on first exercise / reset when emptied
  useEffect(()=>{
    if(exercises.length===1&&!timerStart){
      const start=Date.now();
      setTimerStart(start);setLastActivity(start);setPausedAt(null);
    }
    if(exercises.length===0){
      setTimerStart(null);setPausedAt(null);
    }
  },[exercises.length]);

  // Track activity & auto-resume on any change to exercises (skip first render)
  useEffect(()=>{
    if(firstRender.current){firstRender.current=false;return;}
    if(exercises.length===0)return;
    const now=Date.now();
    setLastActivity(now);
    setDraftBanner(null); // al retomar la sesión el borrador ya está recuperado
    if(pausedAt){
      // Resume: shift timerStart forward by paused duration so elapsed continues smoothly
      setTimerStart(ts=>ts+(now-pausedAt));
      setPausedAt(null);
    }
  },[exercises]);

  function selectFromLibrary(libEx){
    setDraftBanner(null);
    setExercises(prev=>[...prev,newSessionExercise(libEx)]);
    // Scroll to bottom after render
    setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:'smooth',block:'end'}),80);
  }
  function saveNewToLibrary(libEx){onAddToLibrary(libEx);selectFromLibrary(libEx);}
  function discardSession(){
    if(!confirm('¿Descartar la sesión actual? Se perderán todos los ejercicios y series.'))return;
    setExercises([]);setTimerStart(null);setPausedAt(null);
    setDraftBanner(null);
    localStorage.removeItem(DRAFT_KEY);
  }
  function save(){
    if(!exercises.length){alert('Añade al menos un ejercicio');return;}
    const cleaned=cleanExercises(exercises);
    if(!cleaned.length){alert('No hay ninguna serie con datos. Rellena al menos una serie antes de guardar.');return;}
    const dropped=exercises.length-cleaned.length;
    const msg='¿Terminar y guardar la sesión?'+(dropped>0?'\n\nSe ignorará'+(dropped>1?'n ':' ')+dropped+' ejercicio'+(dropped>1?'s':'')+' sin datos.':'');
    if(!confirm(msg))return;
    const realEnd=pausedAt||Date.now();
    const durationSecs=timerStart?Math.floor((realEnd-timerStart)/1000):0;
    const session={id:Date.now(),date:new Date().toISOString(),exercises:cleaned,...sessionTotals(cleaned,currentWeight),durationSecs};
    onSave(session);
    setExercises([]);setTimerStart(null);setPausedAt(null);
    setDraftBanner(null);
    localStorage.removeItem(DRAFT_KEY);
    setCompletedSession(session);
  }
  return h('div',{className:'content'},
    showNewEx&&h(NewExerciseModal,{initialName:newExName,onSave:saveNewToLibrary,onClose:()=>setShowNewEx(false)}),
    completedSession&&h(SessionCompleteModal,{session:completedSession,onClose:()=>setCompletedSession(null)}),
    h('div',{className:'ptitle'},'HOY'),
    h('div',{className:'psub'},new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})),
    h(ProfileBanner,{profile,weightLog,onGoToProfile}),
    // Draft recovery banner
    draftBanner&&exercises.length>0&&h('div',{className:'notice notice-info',style:{
      display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,marginTop:0,marginBottom:12,
    }},
      h('span',null,'📋 Borrador recuperado del '+draftBanner),
      h('button',{onClick:discardSession,style:{
        background:'transparent',border:'none',color:'inherit',cursor:'pointer',
        fontFamily:'inherit',fontSize:12,fontWeight:600,padding:0,textDecoration:'underline',
      }},'Descartar')
    ),
    timerStart&&h(WorkoutTimer,{timerStart,lastActivity,pausedAt,onAutoPause:setPausedAt}),
    exercises.length>0&&estTotal!==null&&h('div',{className:'cal-preview'},
      h('div',null,h('div',{className:'kcal-num'},'🔥 '+estTotal+' kcal'),h('div',{className:'kcal-sub'},'estimadas esta sesión'),h('div',{className:'kcal-note'},'Se actualiza en tiempo real'))
    ),
    h('div',{className:'card'},
      h('div',{className:'cardtitle',style:{marginBottom:10}},'Añadir ejercicio'),
      h(ExercisePicker,{library,onSelect:selectFromLibrary,onCreateNew:(n)=>{setNewExName(n);setShowNewEx(true);}})
    ),
    exercises.length>0&&h('div',{className:'card'},
      h('div',{className:'cardtitle'},'Esta sesión ('+(exercises.length)+')'),
      exercises.map((e,i)=>{
        const prevSets=prevSetsMap.byKey[exKey(e)]||prevSetsMap.byName[e.name]||[];
        return h(ExerciseBlock,{key:e.id,ex:e,onChange:ex=>setExercises(prev=>prev.map((x,j)=>j===i?ex:x)),onRemove:()=>{
          // Solo pedimos confirmación si hay datos que perder
          if(exerciseHasData(e)&&!confirm('¿Eliminar "'+e.name+'" y todas sus series?'))return;
          setExercises(prev=>prev.filter((_,j)=>j!==i));
        },bw:currentWeight,prevSets});
      })
    ),
    h('div',{style:{display:'flex',gap:10}},
      h('button',{className:'btn btnp',style:{flex:1},onClick:save},'Guardar sesión'),
      exercises.length>0&&h('button',{className:'btn btns',onClick:discardSession},'Descartar')
    ),
    h('div',{ref:bottomRef})
  );
}

function LibraryTab({library,sessions,onAdd,onRemove,onEdit}){
  const [filter,setFilter]=useState('Todos');
  const [showModal,setShowModal]=useState(false);
  const [editingEx,setEditingEx]=useState(null); // {id, name, muscle}
  const usageMap=useMemo(()=>{const m={};sessions.forEach(s=>s.exercises.forEach(e=>{if(e.libraryId)m[e.libraryId]=(m[e.libraryId]||0)+1;}));return m;},[sessions]);
  const filtered=filter==='Todos'?library:library.filter(e=>e.muscle===filter);
  // Un ejercicio con sesiones no puede pasar de fuerza a cardio (o al revés): su historial tiene
  // series de otro tipo (peso/reps frente a minutos/km) y mezclaría estadísticas y referencias
  const editOrig=editingEx&&library.find(e=>e.id===editingEx.id);
  const typeLocked=!!(editOrig&&usageMap[editOrig.id]);
  const muscleOptions=!typeLocked?MUSCLES:MUSCLES.filter(m=>(m==='Cardio')===!!editOrig.isCardio);

  function saveEdit(){
    if(!editingEx.name.trim()){alert('El nombre no puede estar vacío');return;}
    onEdit(editingEx);
    setEditingEx(null);
  }

  return h('div',{className:'content'},
    showModal&&h(NewExerciseModal,{initialName:'',onSave:ex=>{onAdd(ex);setShowModal(false);},onClose:()=>setShowModal(false)}),

    // Edit modal
    editingEx&&h('div',{className:'overlay',onClick:e=>{if(e.target===e.currentTarget)setEditingEx(null)}},
      h('div',{className:'modal'},
        h('div',{className:'modal-handle'}),
        h('div',{className:'modaltitle'},'Editar ejercicio'),
        h('div',{style:{fontSize:12,color:'var(--t2)',background:'var(--bg2)',borderRadius:8,padding:'8px 12px',marginBottom:14,lineHeight:1.5}},
          '⚠ Las sesiones ya registradas conservan el nombre original en el historial, pero las estadísticas y la referencia de la sesión anterior siguen vinculadas a este ejercicio.'
        ),
        h('div',{className:'fg'},
          h('label',null,'Nombre'),
          h('input',{value:editingEx.name,onChange:e=>setEditingEx({...editingEx,name:e.target.value}),autoFocus:true})
        ),
        h('div',{className:'fg'},
          h('label',null,'Grupo muscular'),
          h('select',{value:editingEx.muscle,disabled:muscleOptions.length===1,onChange:e=>setEditingEx({...editingEx,muscle:e.target.value,isCardio:e.target.value==='Cardio'})},
            muscleOptions.map(m=>h('option',{key:m},m))
          ),
          typeLocked&&h('div',{style:{fontSize:11,color:'var(--t2)',marginTop:2}},
            editOrig.isCardio
              ?'Tiene sesiones registradas: no puede pasar a ser de fuerza.'
              :'Tiene sesiones registradas: no puede pasar a ser de cardio.')
        ),
        h('div',{style:{display:'flex',gap:8,marginTop:8}},
          h('button',{className:'btn btnp',style:{flex:1},onClick:saveEdit},'Guardar cambios'),
          h('button',{className:'btn btns',onClick:()=>setEditingEx(null)},'Cancelar')
        )
      )
    ),

    h('div',{className:'ptitle'},'BIBLIOTECA'),
    h('div',{className:'psub'},library.length+' ejercicios disponibles'),
    h('div',{style:{display:'flex',justifyContent:'flex-end',marginBottom:12}},
      h('button',{className:'btn btnp btnsm',onClick:()=>setShowModal(true)},'+ Nuevo ejercicio')
    ),
    h('div',{className:'lib-filter'},['Todos',...MUSCLES].map(m=>
      h('button',{key:m,className:'lib-filter-btn'+(filter===m?' active':''),onClick:()=>setFilter(m)},m)
    )),
    h('div',{className:'card'},
      filtered.length===0
        ? h('div',{className:'empty'},h('div',{className:'empty-icon'},'🔍'),h('div',null,'Sin ejercicios en este grupo'))
        : filtered.map(ex=>h('div',{key:ex.id,className:'lib-ex-row'},
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{className:'lib-ex-name'},ex.name),
              h('div',{style:{display:'flex',gap:6,marginTop:4,alignItems:'center'}},
                h('span',{className:`tag ${MUSCLE_COLORS[ex.muscle]||'tb'}`},ex.muscle),
                usageMap[ex.id]&&h('span',{style:{fontSize:11,color:'var(--t2)'}},
                  usageMap[ex.id]+' '+(usageMap[ex.id]===1?'vez':'veces'))
              )
            ),
            h('div',{style:{display:'flex',gap:6,flexShrink:0}},
              h('button',{
                className:'btn btns btnsm',
                onClick:()=>setEditingEx({id:ex.id,name:ex.name,muscle:ex.muscle,isCardio:ex.isCardio})
              },'Editar'),
              String(ex.id).startsWith('c-')&&h('button',{className:'btnd',onClick:()=>onRemove(ex.id)},'Eliminar')
            )
          ))
    )
  );
}

function SessionEditModal({session,library,weightLog,onSave,onClose}){
  const [exercises,setExercises]=useState(()=>session.exercises.map(e=>({...e,sets:e.sets.map(s=>({...s}))})));
  // Las calorías se recalculan con el peso corporal registrado en la fecha de la sesión
  const bw=weightAt(weightLog,session.date);

  function save(){
    const cleaned=cleanExercises(exercises);
    if(!cleaned.length){alert('La sesión no tiene ninguna serie con datos. Si quieres quitarla, usa "Eliminar sesión".');return;}
    const totals=sessionTotals(cleaned,bw);
    if(!bw)totals.calories=session.calories||0; // sin registro de peso no se puede recalcular: conservar el valor guardado
    onSave({...session,exercises:cleaned,...totals});
    onClose();
  }

  // Sin cierre al tocar el fondo: se perderían los cambios por accidente
  return h('div',{className:'overlay'},
    h('div',{className:'modal'},
      h('div',{className:'modal-handle'}),
      h('div',{className:'modaltitle',style:{marginBottom:4}},'Editar sesión'),
      h('div',{className:'psub'},fmtDate(session.date)),
      exercises.map((e,i)=>h(ExerciseBlock,{key:e.id,ex:e,bw,
        onChange:ex=>setExercises(prev=>prev.map((x,j)=>j===i?ex:x)),
        onRemove:()=>{
          if(exerciseHasData(e)&&!confirm('¿Eliminar "'+e.name+'" de esta sesión?'))return;
          setExercises(prev=>prev.filter((_,j)=>j!==i));
        }})),
      h('div',{style:{margin:'12px 0'}},
        h(ExercisePicker,{library,onSelect:libEx=>setExercises(prev=>[...prev,newSessionExercise(libEx)])})
      ),
      h('div',{style:{display:'flex',gap:8,marginTop:8}},
        h('button',{className:'btn btnp',style:{flex:1},onClick:save},'Guardar cambios'),
        h('button',{className:'btn btns',onClick:onClose},'Cancelar')
      )
    )
  );
}

function HistoryTab({sessions,library,weightLog,onDelete,onUpdate}){

  const [mounted,setMounted]=useState(()=>new Set());
  function toggle(id){
    if(openId===id){setOpenId(null);return;}
    if(!mounted.has(id)){

  return h('div',{className:'content'},

                  s.totalVolume>0&&h('span',{className:'sbadge'},Math.round(s.totalVolume).toLocaleString('es-ES')+' kg'),

                  h('path',{d:'M6 9l6 6 6-6'})

// ---- Training Calendar ----
function TrainingCalendar({sessions}){
  const now=new Date();
  const [viewYear,setViewYear]=useState(now.getFullYear());
  const [viewMonth,setViewMonth]=useState(now.getMonth()); // 0-based

  // Fechas locales "YYYY-MM-DD" con entrenamiento (incluye otros meses para las celdas de los bordes)
  const trainedDays=useMemo(()=>new Set(sessions.map(s=>localISODate(new Date(s.date)))),[sessions]);

  function prevMonth(){
    if(viewMonth===0){setViewMonth(11);setViewYear(y=>y-1);}
    else setViewMonth(m=>m-1);
  }
  function nextMonth(){
    const ny=viewMonth===11?viewYear+1:viewYear;
    const nm=viewMonth===11?0:viewMonth+1;
    // don't go past current month
    if(ny>now.getFullYear()||(ny===now.getFullYear()&&nm>now.getMonth()))return;
    setViewMonth(nm);setViewYear(ny);
  }

  const monthName=new Date(viewYear,viewMonth,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  const firstDow=(new Date(viewYear,viewMonth,1).getDay()+6)%7; // Mon=0
  const daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();
  const totalCells=Math.ceil((firstDow+daysInMonth)/7)*7;
  const isCurrentMonth=viewYear===now.getFullYear()&&viewMonth===now.getMonth();
  const todayISO=localISODate(now);

  const cells=[];
  let trainedCount=0;
  for(let i=0;i<totalCells;i++){
    // new Date desborda solo al mes anterior/siguiente para las celdas de los bordes
    const date=new Date(viewYear,viewMonth,i-firstDow+1);
    const iso=localISODate(date);
    const isCurrentMonthDay=date.getMonth()===viewMonth;
    const isTrained=trainedDays.has(iso);
    if(isTrained&&isCurrentMonthDay)trainedCount++;
    const cls=['cal-day',!isCurrentMonthDay?'other-month':'',isTrained?'trained':'',iso===todayISO?'today':''].filter(Boolean).join(' ');
    cells.push(h('div',{key:i,className:cls},date.getDate()));
  }

  const atMaxMonth=isCurrentMonth;

  return h('div',{className:'card'},
    h('div',{className:'cal-nav'},
      h('button',{className:'cal-nav-btn',onClick:prevMonth},'‹'),
      h('div',{style:{textAlign:'center'}},
        h('div',{className:'cal-month-label'},monthName.charAt(0).toUpperCase()+monthName.slice(1)),
        trainedCount>0&&h('div',{style:{fontSize:11,color:'var(--accent)',fontWeight:600,marginTop:2}},trainedCount+' día'+(trainedCount!==1?'s':'')+' entrenado'+(trainedCount!==1?'s':''))
      ),
      h('button',{className:'cal-nav-btn',onClick:nextMonth,style:{opacity:atMaxMonth?.3:1,cursor:atMaxMonth?'default':'pointer'}},'›')
    ),
    h('div',{className:'cal-grid'},
      ['L','M','X','J','V','S','D'].map(d=>h('div',{key:d,className:'cal-dow'},d)),
      ...cells
    ),
    h('div',{className:'cal-legend'},
      h('div',{className:'cal-legend-dot',style:{background:'var(--accent)'}}),
      h('span',null,'Día entrenado'),
      h('div',{className:'cal-legend-dot',style:{background:'transparent',boxShadow:'0 0 0 2px var(--accent2)'}}),
      h('span',null,'Hoy')
    )
  );
}

// ---- Stats Tab ----
// Tramos del gráfico, de más antiguo a más reciente. Se construyen con fechas de calendario locales
// (new Date(y,m,d+k)) para que el cambio de hora no desplace los límites.
function statsBuckets(period,now=new Date()){
  const y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  if(period==='week')return Array.from({length:7},(_,i)=>{
    const from=new Date(y,m,d-6+i);
    return {label:from.toLocaleDateString('es-ES',{weekday:'short'}),from,to:new Date(y,m,d-5+i)};
  });
  if(period==='month')return Array.from({length:4},(_,i)=>{
    const from=new Date(y,m,d-27+i*7);
    return {label:fmtShort(from),from,to:new Date(y,m,d-20+i*7)};
  });
  return Array.from({length:12},(_,i)=>{
    const from=new Date(y,m-11+i,1);
    return {label:from.toLocaleDateString('es-ES',{month:'short'}),from,to:new Date(y,m-10+i,1)};
  });
}

function StatsTab({sessions,library,day}){
  const [period,setPeriod]=useState('week');
  const [selEx,setSelEx]=useState('');
  const buckets=useMemo(()=>statsBuckets(period),[period,sessions,day]);
  const cutoff=buckets[0].from;
  const filtered=useMemo(()=>sessions.filter(s=>new Date(s.date)>=cutoff),[sessions,cutoff]);
  const totalVol=filtered.reduce((s,x)=>s+x.totalVolume,0);
  const totalCal=filtered.reduce((s,x)=>s+(x.calories||0),0);
  const totalCardio=filtered.reduce((s,x)=>s+(x.totalCardioMin||0),0);
  const totalKm=filtered.reduce((s,x)=>s+(x.totalCardioKm||0),0);
  const avgDurSecs=filtered.filter(s=>s.durationSecs>0).length>0
    ?Math.round(filtered.filter(s=>s.durationSecs>0).reduce((t,s)=>t+(s.durationSecs||0),0)/filtered.filter(s=>s.durationSecs>0).length)
    :0;

  // Memoizados para que los gráficos no se destruyan y recreen en cada render
  const {labels,volData,calData}=useMemo(()=>{
    const inB=b=>filtered.filter(s=>{const d=new Date(s.date);return d>=b.from&&d<b.to;});
    return {
      labels:buckets.map(b=>b.label),
      volData:buckets.map(b=>Math.round(inB(b).reduce((a,s)=>a+s.totalVolume,0))),
      calData:buckets.map(b=>inB(b).reduce((a,s)=>a+(s.calories||0),0)),
    };
  },[buckets,filtered]);

  // Ejercicios de fuerza agrupados por libraryId (sobrevive a renombrados); nombre actual de la biblioteca
  const {strengthEx,exList,maxW}=useMemo(()=>{
    const libName=Object.fromEntries(library.map(e=>[e.id,e.name]));
    const all={};
    sessions.forEach(s=>s.exercises.forEach(e=>{
      if(e.isCardio)return;
      const k=exKey(e);
      if(!all[k])all[k]={key:k,name:libName[e.libraryId]||e.name,max:0,cnt:0,muscle:e.muscle};
      const mw=Math.max(0,...e.sets.map(s=>parseFloat(s.weight)||0));
      if(mw>all[k].max)all[k].max=mw;
      all[k].cnt++;
    }));
    const list=Object.values(all);
    const top=[...list].sort((a,b)=>b.cnt-a.cnt).slice(0,6);
    return {
      strengthEx:[...list].sort((a,b)=>a.name.localeCompare(b.name,'es')),
      exList:top,
      maxW:Math.max(...top.map(e=>e.max),1),
    };
  },[sessions,library]);
  const selKey=strengthEx.some(e=>e.key===selEx)?selEx:(strengthEx[0]?.key||'');
  const exHistory=useMemo(()=>sessions.slice().reverse().filter(s=>s.exercises.some(e=>exKey(e)===selKey)).map(s=>{
    const ex=s.exercises.find(e=>exKey(e)===selKey);
    return {date:fmtShort(s.date),maxW:Math.max(0,...ex.sets.map(s=>parseFloat(s.weight)||0))};
  }),[sessions,selKey]);
  const exLabels=useMemo(()=>exHistory.map(e=>e.date),[exHistory]);
  const exData=useMemo(()=>exHistory.map(e=>e.maxW),[exHistory]);

  return h('div',{className:'content'},
    h('div',{className:'ptitle'},'ESTADÍSTICAS'),
    h('div',{className:'psub'},'Evolución y rendimiento'),
    h('div',{className:'periodtabs'},['week','month','year'].map((p,i)=>h('button',{key:p,className:'pbtn'+(period===p?' active':''),onClick:()=>setPeriod(p)},['Semana','Mes','Año'][i]))),
    h('div',{className:'mgrid'},
      (totalKm>0?
        [{l:'Sesiones',v:filtered.length,u:''},{l:'Volumen',v:Math.round(totalVol).toLocaleString('es-ES'),u:'kg'},{l:'Calorías',v:totalCal.toLocaleString('es-ES'),u:'kcal'},{l:'Cardio',v:Math.round(totalKm*10)/10,u:'km'},{l:'Duración media',v:avgDurSecs>0?fmtDuration(avgDurSecs):'—',u:''},{l:'Tiempo cardio',v:totalCardio,u:'min'}]
        :[{l:'Sesiones',v:filtered.length,u:''},{l:'Volumen',v:Math.round(totalVol).toLocaleString('es-ES'),u:'kg'},{l:'Calorías',v:totalCal.toLocaleString('es-ES'),u:'kcal'},{l:'Duración media',v:avgDurSecs>0?fmtDuration(avgDurSecs):'—',u:''}])
        .map(m=>h('div',{key:m.l,className:'mcard'},h('div',{className:'mlabel'},m.l),h('div',{className:'mval'},m.v,m.u&&h('span',{className:'unit'},' '+m.u))))
    ),
    h(TrainingCalendar,{sessions}),
    h('div',{className:'card'},h('div',{className:'cardtitle'},'Volumen (kg)'),h(BarChart,{labels,data:volData,color:'#E24B4A'})),
    h('div',{className:'card'},h('div',{className:'cardtitle'},'Calorías (kcal)'),h(BarChart,{labels,data:calData,color:'#BA7517'})),
    exHistory.length>1&&h('div',{className:'card'},
      h('div',{className:'cardtitle'},
        h('span',null,'Progresión de peso'),
        h('select',{value:selKey,onChange:e=>setSelEx(e.target.value),style:{height:26,fontSize:12,border:'0.5px solid var(--border2)',borderRadius:6,background:'var(--bg2)',color:'var(--t1)',fontFamily:'inherit',padding:'0 6px'}},
          strengthEx.map(e=>h('option',{key:e.key,value:e.key},e.name))
        )
      ),
      h(LineChart,{labels:exLabels,data:exData,color:'#E24B4A'})
    ),
    exList.length>0&&h('div',{className:'card'},
      h('div',{className:'cardtitle'},'Peso máximo por ejercicio'),
      exList.map(e=>h('div',{key:e.key,style:{marginBottom:14}},
        h('div',{className:'rowflex'},
          h('div',null,h('span',{style:{fontSize:13,fontWeight:600,color:'var(--t1)'}},e.name),' ',h('span',{className:`tag ${MUSCLE_COLORS[e.muscle]||'tb'}`},e.muscle)),
          h('span',{style:{fontSize:13,fontWeight:600,color:'var(--t1)'}},e.max+' kg')
        ),
        h('div',{className:'pbar'},h('div',{className:'pbarf',style:{width:Math.round((e.max/maxW)*100)+'%'}}))
      ))
    )
  );
}

// ---- Backup Tab ----
function downloadBackup({sessions,library,profile,weightLog}){
  const payload={version:2,exportedAt:new Date().toISOString(),sessions,library,profile,weightLog};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='ironlog-backup-'+localISODate()+'.json';
  a.click();
  // Revocar en diferido: Safari puede cancelar la descarga si se revoca de inmediato
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}

// Comprueba la estructura mínima que la app necesita para no romperse al renderizar
function validateBackup(data){
  const fail=msg=>{throw new Error('Formato inválido: '+msg);};
  if(!data||typeof data!=='object')fail('el archivo no contiene un objeto.');
  if(!Array.isArray(data.sessions))fail('falta la lista de sesiones.');
  if(!Array.isArray(data.library))fail('falta la biblioteca.');
  data.sessions.forEach((s,i)=>{
    const n='sesión '+(i+1);
    if(!s||isNaN(new Date(s.date).getTime()))fail(n+' sin fecha válida.');
    if(!Array.isArray(s.exercises))fail(n+' sin lista de ejercicios.');
    s.exercises.forEach(e=>{
      if(!e||typeof e.name!=='string'||!Array.isArray(e.sets))fail(n+' tiene un ejercicio mal formado.');
    });
  });
  data.library.forEach((e,i)=>{
    if(!e||e.id==null||typeof e.name!=='string'||typeof e.muscle!=='string')fail('ejercicio '+(i+1)+' de la biblioteca mal formado.');
  });
  if(data.weightLog!=null&&!Array.isArray(data.weightLog))fail('el registro de peso no es una lista.');
  if(data.profile!=null&&typeof data.profile!=='object')fail('el perfil no es válido.');
}
function BackupTab({sessions,library,profile,weightLog,onRestore,onExported}){
  const [importError,setImportError]=useState('');
  const [importOk,setImportOk]=useState(false);
  const fileRef=useRef();

  const dataSize=useMemo(()=>{
    const raw=JSON.stringify({sessions,library,profile,weightLog});
    return (new Blob([raw]).size/1024).toFixed(1);
  },[sessions,library,profile,weightLog]);

  function exportData(){
    downloadBackup({sessions,library,profile,weightLog});
    onExported&&onExported();
  }

  function handleFileChange(e){
    setImportError('');setImportOk(false);
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        validateBackup(data);
        const confirm=window.confirm(
          `Se van a importar:\n• ${data.sessions.length} sesiones\n• ${data.library.length} ejercicios\n\nEsto reemplazará todos los datos actuales. ¿Continuar?`
        );
        if(!confirm){e.target.value='';return;}
        onRestore(data);
        setImportOk(true);
      }catch(err){
        setImportError('Error al leer el archivo: '+err.message);
      }
      e.target.value='';
    };
    reader.readAsText(file);
  }

  return h('div',{className:'content'},
    h('div',{className:'ptitle'},'COPIA DE SEGURIDAD'),
    h('div',{className:'psub'},'Exporta e importa todos tus datos'),

    h('div',{className:'card'},
      h('div',{className:'cardtitle'},'Exportar'),
      h('p',{style:{fontSize:13,color:'var(--t2)',lineHeight:1.6,marginBottom:16}},
        'Descarga un archivo JSON con todas tus sesiones, ejercicios y perfil. Guárdalo en iCloud, Google Drive o donde prefieras. Puedes importarlo en cualquier momento para restaurar todo.'
      ),
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',background:'var(--bg2)',borderRadius:10,marginBottom:14}},
        h('div',null,
          h('div',{style:{fontSize:13,fontWeight:600,color:'var(--t1)'}},sessions.length+' sesiones · '+library.length+' ejercicios'),
          h('div',{style:{fontSize:11,color:'var(--t2)',marginTop:2}},'Tamaño estimado: '+dataSize+' KB')
        ),
        h('div',{style:{fontSize:24}},'📦')
      ),
      h('button',{className:'btn btnp',style:{width:'100%'},onClick:exportData},
        '⬇ Descargar copia de seguridad'
      )
    ),

    h('div',{className:'card'},
      h('div',{className:'cardtitle'},'Importar'),
      h('p',{style:{fontSize:13,color:'var(--t2)',lineHeight:1.6,marginBottom:16}},
        'Selecciona un archivo de copia de seguridad generado por IronLog para restaurar tus datos. ',
        h('strong',{style:{color:'var(--accent)'}},'Atención: esto reemplazará todos los datos actuales.')
      ),
      h('input',{ref:fileRef,type:'file',accept:'.json,application/json',style:{display:'none'},onChange:handleFileChange}),
      h('button',{className:'btn btns',style:{width:'100%'},onClick:()=>fileRef.current.click()},
        '⬆ Seleccionar archivo de copia'
      ),
      importError&&h('div',{className:'notice notice-err'},importError),
      importOk&&h('div',{className:'notice notice-ok'},'✅ Datos importados correctamente.')
    ),

    h('div',{className:'card'},
      h('div',{className:'cardtitle'},'Cómo guardar la copia en el iPhone'),
      h('p',{style:{fontSize:13,color:'var(--t2)',lineHeight:1.7}},
        '1. Pulsa "Descargar copia de seguridad".',h('br',null),
        '2. Safari te preguntará dónde guardarlo — elige ',h('strong',{style:{color:'var(--t1)'}},'iCloud Drive'),
        ' o ',h('strong',{style:{color:'var(--t1)'}},'En mi iPhone'),'.',h('br',null),
        '3. Para restaurar, abre IronLog, ven aquí e importa ese archivo desde la app Archivos.'
      )
    )
  );
}

// Repara registros con fecha inválida (bug antiguo: date:'custom'); el id es el timestamp de creación
function repairWeightLog(log){
  return log
    .map(e=>isValidDate(e.date)?e:{...e,date:localISODate(new Date(e.id))})
    .sort((a,b)=>parseLocalDate(a.date)-parseLocalDate(b.date));
}

// ---- App Root ----
function App(){
  // Al cambiar de día se repinta todo (fecha superior, "HOY", calendario, estadísticas)
  const day=useCurrentDay();
  const [tab,setTab]=useState('workout');
  const [sessions,setSessions]=useState(()=>migrateSessions(loadState('il_sessions',[])));
  const [library,setLibrary]=useState(()=>migrateLibrary(loadState('il_library',DEFAULT_LIBRARY)));
  const [profile,setProfile]=useState(()=>loadState('il_profile',{name:'',sex:'',dob:''}));
  const [weightLog,setWeightLog]=useState(()=>repairWeightLog(loadState('il_weightlog',[])));
  const [hasActiveSession,setHasActiveSession]=useState(false);
  const [lastBackup,setLastBackup]=useState(()=>loadState('il_lastBackup',null));

  // Pide al navegador que no borre los datos automáticamente (Safari puede hacerlo tras 7 días sin uso)
  useEffect(()=>{try{navigator.storage?.persist?.();}catch(e){}},[]);

  useEffect(()=>saveState('il_sessions',sessions),[sessions]);
  useEffect(()=>saveState('il_library',library),[library]);
  useEffect(()=>saveState('il_profile',profile),[profile]);
  useEffect(()=>saveState('il_weightlog',weightLog),[weightLog]);

  function addSession(s){setSessions(prev=>[s,...prev]);}
  function deleteSession(id){setSessions(prev=>prev.filter(s=>s.id!==id));}
  function updateSession(updated){setSessions(prev=>prev.map(s=>s.id===updated.id?updated:s));}
  function addToLibrary(ex){setLibrary(prev=>[...prev,ex]);}
  function removeFromLibrary(id){setLibrary(prev=>prev.filter(e=>e.id!==id));}
  function editLibrary(updated){setLibrary(prev=>prev.map(e=>e.id===updated.id?{...e,...updated}:e));}
  function addWeight(entry){setWeightLog(prev=>[...prev,entry].sort((a,b)=>parseLocalDate(a.date)-parseLocalDate(b.date)));}
  function markExported(){const now=Date.now();setLastBackup(now);saveState('il_lastBackup',now);}
  const BACKUP_REMINDER_DAYS=7;
  const backupAgeDays=lastBackup?Math.floor((Date.now()-lastBackup)/864e5):null;
  const needsBackup=sessions.length>0&&(backupAgeDays===null||backupAgeDays>=BACKUP_REMINDER_DAYS);
  function removeWeight(id){setWeightLog(prev=>prev.filter(e=>e.id!==id));}
  function restoreBackup(data){
    setSessions(migrateSessions(data.sessions));
    setLibrary(migrateLibrary(data.library));
    if(data.profile)setProfile(data.profile);
    if(data.weightLog)setWeightLog(repairWeightLog(data.weightLog));

    {id:'profile', label:'Perfil',    Icon:()=>h('svg',{viewBox:'0 0 24 24'},h('circle',{cx:12,cy:8,r:4}),h('path',{d:'M4 20c0-4 3.6-7 8-7s8 3 8 7'}))},
    {id:'backup',  label:'Backup',    Icon:()=>h('svg',{viewBox:'0 0 24 24'},h('path',{d:'M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4'}),h('polyline',{points:'7 10 12 15 17 10'}),h('line',{x1:'12',y1:'15',x2:'12',y2:'3'}))},
  ];

  return h('div',{className:'app'},
    h('div',{className:'topbar'},
      h('div',{className:'logo'},'IRON',h('span',null,'LOG')),
      h('div',{className:'datebadge'},today())
    ),
    h('div',{className:'nav'},
      TABS.map(t=>h('div',{key:t.id,className:'navbtn-wrap'},
        h('button',{className:'navbtn'+(tab===t.id?' active':''),onClick:()=>setTab(t.id),style:{width:'100%'}},
          h(t.Icon),h('span',null,t.label)
        ),
        t.id==='workout'&&hasActiveSession&&tab!=='workout'&&h('div',{className:'navbtn-dot'})
      ))
    ),
    needsBackup&&tab==='workout'&&h('div',{style:{padding:'12px 16px 0'}},
      h('div',{className:'profile-bar',style:{marginBottom:0}},
        h('span',null,'💾 ',backupAgeDays===null?'Aún no has hecho ninguna copia de seguridad':'Última copia hace '+backupAgeDays+' días'),
        h('button',{className:'btn btns btnsm',onClick:()=>setTab('backup')},'Hacer copia')
      )
    ),
    // All tabs stay mounted — only active one is visible.
    h('div',{style:{display:tab==='workout'?'block':'none'}},
      h(WorkoutTab,{sessions,library,onSave:addSession,profile,weightLog,onGoToProfile:()=>setTab('profile'),onAddToLibrary:addToLibrary,onActiveSessionChange:setHasActiveSession})),
    h('div',{style:{display:tab==='library'?'block':'none'}},
      h(LibraryTab,{library,sessions,onAdd:addToLibrary,onRemove:removeFromLibrary,onEdit:editLibrary})),
    h('div',{style:{display:tab==='history'?'block':'none'}},
      h(HistoryTab,{sessions,library,weightLog,onDelete:deleteSession,onUpdate:updateSession})),
    h('div',{style:{display:tab==='stats'?'block':'none'}},
      h(StatsTab,{sessions,library,day})),
    h('div',{style:{display:tab==='profile'?'block':'none'}},
      h(ProfileTab,{profile,onChange:setProfile,weightLog,onAddWeight:addWeight,onRemoveWeight:removeWeight,sessions})),
    h('div',{style:{display:tab==='backup'?'block':'none'}},
      h(BackupTab,{sessions,library,profile,weightLog,onRestore:restoreBackup,onExported:markExported}))
  );
}

// Si algo falla al renderizar, en vez de pantalla en blanco se muestra un aviso con opción de rescatar los datos
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={error:null};}
  static getDerivedStateFromError(error){return {error};}
  componentDidCatch(error,info){console.error(error,info);}
  render(){
    if(!this.state.error)return this.props.children;
    const rescue=()=>downloadBackup({
      sessions:loadState('il_sessions',[]),library:loadState('il_library',[]),
      profile:loadState('il_profile',{}),weightLog:loadState('il_weightlog',[]),
    });
    return h('div',{className:'content'},
      h('div',{className:'card'},
        h('div',{className:'ptitle',style:{fontSize:20}},'Algo ha fallado'),
        h('p',{style:{fontSize:13,color:'var(--t2)',lineHeight:1.6,margin:'8px 0 16px'}},
          'Tus datos siguen guardados en el dispositivo. Descarga una copia antes de nada y después prueba a recargar.'),
        h('pre',{style:{fontSize:11,color:'var(--t2)',whiteSpace:'pre-wrap',marginBottom:16}},String(this.state.error?.message||this.state.error)),
        h('div',{style:{display:'flex',gap:8}},
          h('button',{className:'btn btnp',style:{flex:1},onClick:rescue},'⬇ Descargar datos'),
          h('button',{className:'btn btns',onClick:()=>location.reload()},'Recargar')
        )
      )
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(h(ErrorBoundary,null,h(App,null)));

// Service worker para uso offline (solo funciona servido por http/https, no abriendo el archivo directamente)
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
